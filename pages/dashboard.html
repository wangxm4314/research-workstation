    <style id="theme-vars">
/* ============================================================
   Research Workstation — Warm Editorial Theme
   科研暖色编辑风格 · 琥珀赭色系
   ============================================================ */

/* ---- Brand Prefix: research ---- */

:root {
  /* ---- Primary Brand Hue (Amber/Ochre) ---- */
  --color-brand-50: #FBF4E8;
  --color-brand-100: #F5E6CC;
  --color-brand-200: #EBCFA0;
  --color-brand-300: #DDB26E;
  --color-brand-400: #C99542;
  --color-brand-500: #B8770C;
  --color-brand-600: #A06608;
  --color-brand-700: #84540A;
  --color-brand-800: #6B450C;
  --color-brand-900: #543708;

  /* ---- Neutral Scale (Warm) ---- */
  --color-neutral-50: #FAF7F2;
  --color-neutral-100: #F5F1EB;
  --color-neutral-200: #E8E2D8;
  --color-neutral-300: #D4CCC0;
  --color-neutral-400: #B0A89C;
  --color-neutral-500: #8A8275;
  --color-neutral-600: #6B6357;
  --color-neutral-700: #4D463C;
  --color-neutral-800: #363028;
  --color-neutral-900: #241F1A;

  /* ---- Semantic Aliases (Light Mode) ---- */
  --research-background: #FAF7F2;
  --research-foreground: #241F1A;
  --research-card: #FFFFFF;
  --research-card-foreground: #241F1A;
  --research-popover: #FFFFFF;
  --research-popover-foreground: #241F1A;
  --research-primary: #B8770C;
  --research-primary-foreground: #FFFFFF;
  --research-muted: #F5F1EB;
  --research-muted-foreground: #6B6357;
  --research-border: #E8E2D8;
  --research-input: #E8E2D8;
  --research-ring: #B8770C;

  /* ---- Surface Tokens ---- */
  --research-surface: #FFFFFF;
  --research-surface-2: #F5F1EB;
  --research-surface-3: #EFE9DF;

  /* ---- Ink Tokens ---- */
  --research-ink: #241F1A;
  --research-ink-2: #4D463C;
  --research-ink-3: #8A8275;

  /* ---- Line Token ---- */
  --research-line: #E8E2D8;

  /* ---- Radius Scale ---- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  --research-radius-small: 4px;
  --research-radius-medium: 8px;
  --research-radius-large: 16px;

  /* ---- Shadow Scale ---- */
  --research-shadow-1: 0 1px 2px rgba(36, 31, 26, 0.04), 0 1px 1px rgba(36, 31, 26, 0.02);
  --research-shadow-floating: 0 8px 24px -8px rgba(36, 31, 26, 0.12);
  --research-shadow-modal: 0 24px 60px -20px rgba(36, 31, 26, 0.20);

  /* ---- Spacing Scale (8pt grid) ---- */
  --research-s-1: 4px;
  --research-s-2: 8px;
  --research-s-3: 12px;
  --research-s-4: 16px;
  --research-s-5: 24px;
  --research-s-6: 32px;
  --research-s-7: 48px;
  --research-s-8: 80px;

  /* ---- State Colors ---- */
  --state-success: #4A7C4A;
  --state-warning: #C99542;
  --state-error: #B0454B;
  --state-info: #4A6B8A;

  /* ---- Typography ---- */
  --research-font-serif: "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
  --research-font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --research-font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", monospace;

  /* ---- Color alias for general use ---- */
  --research-brand: #B8770C;
  --research-brand-ink: #FFFFFF;
}

/* ---- Dark Mode ---- */
.dark {
  --research-background: #1A1612;
  --research-foreground: #E8E2D8;
  --research-card: #241F1A;
  --research-card-foreground: #E8E2D8;
  --research-popover: #2A241E;
  --research-popover-foreground: #E8E2D8;
  --research-primary: #C99542;
  --research-primary-foreground: #1A1612;
  --research-muted: #2A241E;
  --research-muted-foreground: #B0A89C;
  --research-border: #363028;
  --research-input: #363028;
  --research-ring: #C99542;

  --research-surface: #241F1A;
  --research-surface-2: #2A241E;
  --research-surface-3: #363028;

  --research-ink: #E8E2D8;
  --research-ink-2: #B0A89C;
  --research-ink-3: #8A8275;

  --research-line: #363028;

  --state-success: #6B9C6B;
  --state-warning: #DDB26E;
  --state-error: #D06870;
  --state-info: #7A9CBA;

  --research-brand: #C99542;
  --research-brand-ink: #1A1612;
}

<body class="min-h-screen font-sans antialiased">
    <main>
      <!-- Sidebar -->
      <aside style="position:fixed; top:0; left:0; width:240px; height:100vh; background:var(--research-surface); border-right:1px solid var(--research-border); display:flex; flex-direction:column; z-index:50;">

        <!-- Navigation -->
        <nav style="flex:1; overflow-y:auto;">
          <a href="#" data-dom-id="nav-dashboard" data-nav-key="dashboard" data-active="true" style="display:flex; align-items:center; gap:12px; padding:12px 24px; font-size:14px; color:var(--research-primary); border-left:3px solid var(--research-primary); background:var(--research-surface-2); transition:color 120ms; text-decoration:none;">

            <i data-lucide="code-2" style="width:20px; height:20px;"></i>
            <span>脚本仓库</span>
          </a>
          <a href="#" data-dom-id="nav-literature" data-nav-key="literature" style="display:flex; align-items:center; gap:12px; padding:12px 24px; font-size:14px; color:var(--research-ink-2); border-left:3px solid transparent; transition:color 120ms; text-decoration:none;" onmouseover="this.style.background='var(--research-surface-2)';this.style.color='var(--research-ink)'" onmouseout="this.style.background='';this.style.color='var(--research-ink-2)'">

          </div>

            <div style="width:36px; height:36px; border-radius:var(--radius-full); background:var(--research-surface-3); display:flex; align-items:center; justify-content:center; flex-shrink:0;">

    <script>
    (function() {
      // 模块定义
      var MODULES = [
        { key: DB.KEYS.ARTICLES,   statKey: 'articles',   icon: 'newspaper', name: '公众号推文', unit: '篇推文', page: 'mp-articles.html' },
        { key: DB.KEYS.SCRIPTS,    statKey: 'scripts',    icon: 'code-2',    name: '脚本仓库',   unit: '个脚本', page: 'scripts.html' },
        { key: DB.KEYS.LITERATURE, statKey: 'literature', icon: 'book-open', name: '文献阅读',   unit: '篇文献', page: 'literature.html' },
        { key: DB.KEYS.IMAGES,     statKey: 'images',     icon: 'image',     name: '图片存储',   unit: '张图片', page: 'gallery.html' },
        { key: DB.KEYS.WRITINGS,   statKey: 'writings',   icon: 'pen-line',  name: '文章撰写',   unit: '篇在写', page: 'writing.html' }
      ];

      var container = document.getElementById('dashboard-content');

      // 格式化当前日期
      function formatToday() {
        var d = new Date();
        var weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
        return d.getFullYear() + '年' + String(d.getMonth()+1).padStart(2,'0') + '月' + String(d.getDate()).padStart(2,'0') + '日 ' + weekdays[d.getDay()];
      }
      document.getElementById('today-date').textContent = formatToday();

      // 格式化日期时间（用于时间线）
      function formatDateTime(dateStr) {
        if (!dateStr) return '';
        var d = new Date(dateStr);
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      }

      // 渲染空状态
      function renderEmptyState() {
        container.innerHTML = `
          <section style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 32px; text-align:center;">
            <div style="width:80px; height:80px; border-radius:var(--radius-full); background:var(--research-surface-2); display:flex; align-items:center; justify-content:center; margin-bottom:24px;">
              <i data-lucide="sparkles" style="width:40px; height:40px; color:var(--research-primary);"></i>
            </div>
            <h2 style="font-family:var(--research-font-serif); font-size:22px; font-weight:600; color:var(--research-ink); margin:0 0 12px 0;">欢迎使用科研工作站</h2>
            <p style="font-size:15px; color:var(--research-ink-3); margin:0 0 32px 0; max-width:480px; line-height:1.6;">这是一个个人知识管理系统，涵盖公众号推文、脚本仓库、文献阅读、图片存储和文章撰写五大模块。点击下方任意快捷入口，开始记录你的科研工作。</p>
            <div style="display:flex; flex-wrap:wrap; gap:12px; justify-content:center;">
              ${MODULES.map(function(m) {
                return `
                  <a href="${m.page}" style="display:inline-flex; align-items:center; gap:8px; padding:10px 20px; border:1px solid var(--research-border); border-radius:var(--radius-md); background:var(--research-card); color:var(--research-ink); font-size:14px; text-decoration:none; transition:border-color 120ms;" onmouseover="this.style.borderColor='var(--research-primary)';this.style.color='var(--research-primary)'" onmouseout="this.style.borderColor='var(--research-border)';this.style.color='var(--research-ink)'">
                    <i data-lucide="${m.icon}" style="width:18px; height:18px;"></i>
                    <span>${m.name}</span>
                  </a>
                `;
              }).join('')}
            </div>
          </section>
        `;
      }

      // 渲染统计卡片
      function renderStats(stats) {
        return `
          <section style="display:grid; grid-template-columns:repeat(5, 1fr); gap:16px;">
            ${MODULES.map(function(m) {
              var count = stats[m.statKey] || 0;
              return `
                <a href="${m.page}" style="display:block; background:var(--research-card); border:1px solid var(--research-border); border-radius:var(--radius-lg); padding:24px; position:relative; box-shadow:var(--research-shadow-1); text-decoration:none; transition:border-color 120ms;" onmouseover="this.style.borderColor='var(--research-primary)'" onmouseout="this.style.borderColor='var(--research-border)'">
                  <div style="position:absolute; top:24px; right:24px;">
                    <i data-lucide="${m.icon}" style="width:20px; height:20px; color:var(--research-ink-3);"></i>
                  </div>
                  <div style="font-family:var(--research-font-serif); font-size:32px; font-weight:600; color:var(--research-ink); font-variant-numeric:tabular-nums; line-height:1;">${count}</div>
                  <div style="margin-top:8px; font-size:13px; color:var(--research-ink-3);">${m.unit}</div>
                  <div style="margin-top:4px; font-size:12px; color:var(--research-ink-3);">${m.name}</div>
                </a>
              `;
            }).join('')}
          </section>
        `;
      }

      // 渲染快捷入口
      function renderQuickAccess() {
        return `
          <section style="display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin-top:32px;">
            ${MODULES.map(function(m) {
              var descMap = {
                '公众号推文': '查看和管理已发布的推文',
                '脚本仓库': '存放常用分析脚本和工具代码',
                '文献阅读': '追踪阅读进度和文献笔记',
                '图片存储': 'BioRender制图和科研插图',
                '文章撰写': '课题文章生产过程追踪'
              };
              return `
                <a href="${m.page}" style="display:block; background:var(--research-card); border:1px solid var(--research-border); border-radius:var(--radius-lg); padding:24px; cursor:pointer; text-decoration:none; transition:border-color 120ms;" onmouseover="this.style.borderColor='var(--research-primary)'" onmouseout="this.style.borderColor='var(--research-border)'">
                  <div style="display:flex; align-items:flex-start; justify-content:space-between;">
                    <div>
                      <h3 style="font-family:var(--research-font-serif); font-size:16px; font-weight:600; color:var(--research-ink); margin:0 0 8px 0;">${m.name}</h3>
                      <p style="font-size:13px; color:var(--research-ink-3); margin:0; line-height:1.5;">${descMap[m.name]}</p>
                    </div>
                    <i data-lucide="arrow-right" style="width:20px; height:20px; color:var(--research-primary); flex-shrink:0;"></i>
                  </div>
                </a>
              `;
            }).join('')}
            <a href="knowledge-network.html" style="display:block; background:var(--research-card); border:1px solid var(--research-border); border-radius:var(--radius-lg); padding:24px; cursor:pointer; text-decoration:none; transition:border-color 120ms;" onmouseover="this.style.borderColor='var(--research-primary)'" onmouseout="this.style.borderColor='var(--research-border)'">
              <div style="display:flex; align-items:flex-start; justify-content:space-between;">
                <div>
                  <h3 style="font-family:var(--research-font-serif); font-size:16px; font-weight:600; color:var(--research-ink); margin:0 0 8px 0;">知识网络</h3>
                  <p style="font-size:13px; color:var(--research-ink-3); margin:0; line-height:1.5;">跨模块关键词关联图谱</p>
                </div>
                <i data-lucide="arrow-right" style="width:20px; height:20px; color:var(--research-primary); flex-shrink:0;"></i>
              </div>
            </a>
          </section>
        `;
      }

      // 渲染最近活动时间线
      function renderTimeline() {
        var allItems = [];
        MODULES.forEach(function(m) {
          var records = DB.getAll(m.key);
          records.forEach(function(r) {
            allItems.push({
              title: r.title || r.name || '无标题',
              updatedAt: r.updatedAt || r.createdAt || '',
              moduleName: m.name,
              icon: m.icon
            });
          });
        });

        allItems.sort(function(a, b) {
          var ta = a.updatedAt ? new Date(a.updatedAt).getTime() : 0;
          var tb = b.updatedAt ? new Date(b.updatedAt).getTime() : 0;
          return tb - ta;
        });

        var recent = allItems.slice(0, 10);

        if (recent.length === 0) {
          return `
            <section style="margin-top:32px;">
              <h2 style="font-family:var(--research-font-serif); font-size:18px; font-weight:600; color:var(--research-ink); margin:0 0 16px 0;">最近活动</h2>
              <div style="padding:32px; text-align:center; background:var(--research-card); border:1px solid var(--research-border); border-radius:var(--radius-lg);">
                <i data-lucide="inbox" style="width:32px; height:32px; color:var(--research-ink-3); margin-bottom:8px;"></i>
                <p style="font-size:14px; color:var(--research-ink-3); margin:0;">暂无活动记录</p>
              </div>
            </section>
          `;
        }

        var itemsHTML = recent.map(function(item) {
          return `
            <div style="display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--research-border);">
              <i data-lucide="${item.icon}" style="width:16px; height:16px; color:var(--research-ink-3); flex-shrink:0;"></i>
              <span style="font-size:13px; color:var(--research-ink-3); white-space:nowrap; min-width:140px;">${formatDateTime(item.updatedAt)}</span>
              <span style="font-size:14px; color:var(--research-ink); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${DB.escape(item.title)}</span>
              <span style="height:22px; display:inline-flex; align-items:center; background:var(--research-surface-2); color:var(--research-ink-2); border-radius:var(--radius-sm); padding:2px 8px; font-size:12px; white-space:nowrap;">${item.moduleName}</span>
            </div>
          `;
        }).join('');

        return `
          <section style="margin-top:32px;">
            <h2 style="font-family:var(--research-font-serif); font-size:18px; font-weight:600; color:var(--research-ink); margin:0 0 16px 0;">最近活动</h2>
            <div>${itemsHTML}</div>
          </section>
        `;
      }

      // 渲染数据管理区
      function renderDataManager() {
        return `
          <section style="margin-top:32px;">
            <h2 style="font-family:var(--research-font-serif); font-size:18px; font-weight:600; color:var(--research-ink); margin:0 0 16px 0;">数据管理</h2>
            <div style="display:flex; gap:16px; flex-wrap:wrap;">
              <button id="btn-export" style="display:inline-flex; align-items:center; gap:8px; padding:12px 24px; border:1px solid var(--research-border); border-radius:var(--radius-md); background:var(--research-card); color:var(--research-ink); font-size:14px; cursor:pointer; transition:border-color 120ms;" onmouseover="this.style.borderColor='var(--research-primary)'" onmouseout="this.style.borderColor='var(--research-border)'">
                <i data-lucide="download" style="width:18px; height:18px;"></i>
                <span>导出全部数据</span>
              </button>
              <label style="display:inline-flex; align-items:center; gap:8px; padding:12px 24px; border:1px solid var(--research-border); border-radius:var(--radius-md); background:var(--research-card); color:var(--research-ink); font-size:14px; cursor:pointer; transition:border-color 120ms;" onmouseover="this.style.borderColor='var(--research-primary)'" onmouseout="this.style.borderColor='var(--research-border)'">
                <i data-lucide="upload" style="width:18px; height:18px;"></i>
                <span>导入数据</span>
                <input type="file" id="btn-import" accept=".json" style="display:none;">
              </label>
            </div>
          </section>
        `;
      }

      // 绑定数据管理事件
      function bindDataManager() {
        var exportBtn = document.getElementById('btn-export');
        if (exportBtn) {
          exportBtn.addEventListener('click', function() {
            var data = DB.exportAll();
            var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'research-workstation-backup-' + new Date().toISOString().slice(0,10) + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            UI.toast('数据导出成功', 'success');
          });
        }

        var importInput = document.getElementById('btn-import');
        if (importInput) {
          importInput.addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;
            if (!UI.confirm('导入数据将覆盖当前所有内容，确定继续吗？')) {
              importInput.value = '';
              return;
            }
            var reader = new FileReader();
            reader.onload = function(ev) {
              var success = DB.importAll(ev.target.result);
              if (success) {
                UI.toast('数据导入成功', 'success');
                setTimeout(function() { location.reload(); }, 1000);
              } else {
                UI.toast('数据导入失败，请检查文件格式', 'error');
              }
            };
            reader.readAsText(file);
          });
        }
      }

      // 主渲染函数
      function render() {
        var stats = DB.getStats();
        var total = stats.articles + stats.scripts + stats.literature + stats.images + stats.writings;

        if (total === 0) {
          renderEmptyState();
        } else {
          container.innerHTML =
            renderStats(stats) +
            renderQuickAccess() +
            renderTimeline() +
            renderDataManager();
          bindDataManager();
        }

        // 重新创建图标
        if (window.lucide && lucide.createIcons) {
          lucide.createIcons();
        }
      }

      // 启动渲染
      render();
    })();
    </script>
</body>
</html>
