<script>
// ============================================================
//  脚本仓库 CRUD 逻辑
// ============================================================

const LANGUAGES = ['Python', 'R', 'Shell', 'JavaScript', '其他'];
const CATEGORIES = ['数据处理', '可视化', '统计分析', '文件操作', '其他'];

// 状态
const state = {
  search: '',
  langFilter: '',
  catFilter: '',
  categoryCollapsed: false
};

// ---- 获取所有脚本 ----
function getAllScripts() {
  return DB.getAll(DB.KEYS.SCRIPTS);
}

// ---- 过后的脚本列表 ----
function getFilteredScripts() {
  let list = getAllScripts();
  if (state.langFilter) {
    list = list.filter(s => s.language === state.langFilter);
  }
  if (state.catFilter) {
    list = list.filter(s => s.category === state.catFilter);
  }
  if (state.search.trim()) {
    const q = state.search.trim().toLowerCase();
    list = list.filter(s =>
      (s.title || '').toLowerCase().includes(q) ||
      (s.description || '').toLowerCase().includes(q)
    );
  }
  return list;
}

// ---- 渲染分类树 ----
function renderCategoryTree() {
  const container = document.getElementById('categoryTree');
  const allScripts = getAllScripts();

  // 统计每个分类数量
  const counts = {};
  CATEGORIES.forEach(c => counts[c] = 0);
  allScripts.forEach(s => {
    if (s.category && counts[s.category] !== undefined) {
      counts[s.category]++;
    }
  });

  // 全部计数
  const totalAll = allScripts.length;

  // 当前选中状态
  const isAllActive = !state.catFilter;

  let html = `
    <div onclick="toggleCategoryTree()" style="font-family:var(--research-font-serif);font-size:16px;font-weight:600;color:var(--research-ink);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--research-border);display:flex;justify-content:space-between;align-items:center;cursor:pointer;">
      <span>分类</span>
      <i data-lucide="${state.categoryCollapsed ? 'chevron-right' : 'chevron-down'}" style="width:16px;height:16px;color:var(--research-ink-3);"></i>
    </div>
  `;

  if (!state.categoryCollapsed) {
    html += `<div style="display:flex;flex-direction:column;gap:4px;">`;
    // 全部
    html += `
      <div onclick="selectCategory('')" style="padding:8px 12px;font-size:14px;${isAllActive ? 'background:var(--research-surface-2);color:var(--research-primary);font-weight:500;' : 'color:var(--research-ink-2);'}border-radius:var(--radius-sm);cursor:pointer;display:flex;justify-content:space-between;align-items:center;" onmouseover="if(!${isAllActive})this.style.background='var(--research-surface-2)'" onmouseout="if(!${isAllActive})this.style.background='transparent'">
        <span>全部脚本</span>
        <span style="background:${isAllActive ? 'var(--research-primary)' : 'var(--research-surface-3)'};color:${isAllActive ? 'var(--research-primary-foreground)' : 'var(--research-ink-2)'};font-size:11px;padding:1px 6px;border-radius:var(--radius-full);">${totalAll}</span>
      </div>
    `;
    // 各分类
    CATEGORIES.forEach(cat => {
      const isActive = state.catFilter === cat;
      const count = counts[cat] || 0;
      html += `
        <div onclick="selectCategory('${cat}')" style="padding:8px 12px;font-size:14px;${isActive ? 'background:var(--research-surface-2);color:var(--research-primary);font-weight:500;' : 'color:var(--research-ink-2);'}border-radius:var(--radius-sm);cursor:pointer;display:flex;justify-content:space-between;align-items:center;" onmouseover="if(!${isActive})this.style.background='var(--research-surface-2)'" onmouseout="if(!${isActive})this.style.background='transparent'">
          <span>${cat}</span>
          <span style="background:${isActive ? 'var(--research-primary)' : 'var(--research-surface-3)'};color:${isActive ? 'var(--research-primary-foreground)' : 'var(--research-ink-2)'};font-size:11px;padding:1px 6px;border-radius:var(--radius-full);">${count}</span>
        </div>
      `;
    });
    html += `</div>`;
  }

  container.innerHTML = html;
  lucide.createIcons();
}

// ---- 折叠/展开分类树 ----
function toggleCategoryTree() {
  state.categoryCollapsed = !state.categoryCollapsed;
  renderCategoryTree();
}

// ---- 选择分类 ----
function selectCategory(cat) {
  state.catFilter = cat;
  document.getElementById('catFilter').value = cat;
  renderCategoryTree();
  renderScriptList();
}

// ---- 渲染脚本列表 ----
function renderScriptList() {
  const container = document.getElementById('scriptList');
  const scripts = getFilteredScripts();

  if (scripts.length === 0) {
    container.innerHTML = `
      <div style="background:var(--research-card);border:1px solid var(--research-border);border-radius:var(--radius-lg);padding:64px 32px;text-align:center;">
        <div style="display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:var(--radius-full);background:var(--research-surface-2);margin-bottom:16px;">
          <i data-lucide="file-code" style="width:28px;height:28px;color:var(--research-ink-3);"></i>
        </div>
        <p style="font-size:16px;color:var(--research-ink-2);margin:0 0 8px;">暂无脚本</p>
        <p style="font-size:14px;color:var(--research-ink-3);margin:0 0 20px;">${state.search || state.langFilter || state.catFilter ? '没有匹配的脚本，试试调整筛选条件' : '点击"添加脚本"按钮来创建你的第一个脚本'}</p>
        ${state.search || state.langFilter || state.catFilter ? '' : `<button onclick="openAddModal()" style="background:var(--research-primary);color:var(--research-primary-foreground);padding:8px 20px;border-radius:var(--radius-md);font-size:14px;font-weight:500;border:none;cursor:pointer;font-family:var(--research-font-sans);display:inline-flex;align-items:center;gap:6px;"><i data-lucide="plus" style="width:16px;height:16px;"></i>添加脚本</button>`}
      </div>
    `;
    lucide.createIcons();
    updateFooter(scripts.length);
    return;
  }

  let html = '';
  scripts.forEach(s => {
    const keywords = (s.keywords || []).map(kw =>
      `<span style="background:var(--research-surface-2);color:var(--research-ink-2);font-size:12px;padding:2px 8px;border-radius:var(--radius-sm);">${DB.escape(kw)}</span>`
    ).join(' ');

    const codePreview = (s.code || '').substring(0, 200);
    const escapedCode = DB.escape(codePreview);

    html += `
      <div style="background:var(--research-card);border:1px solid var(--research-border);border-radius:var(--radius-lg);padding:20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span style="font-family:var(--research-font-mono);font-size:15px;font-weight:500;color:var(--research-ink);">${DB.escape(s.title || '未命名脚本')}</span>
            <span style="font-size:12px;padding:2px 8px;border-radius:var(--radius-sm);background:var(--research-surface-2);color:var(--research-ink-2);">${DB.escape(s.language || '其他')}</span>
            <span style="font-size:12px;padding:2px 8px;border-radius:var(--radius-sm);background:var(--research-surface-3);color:var(--research-ink-2);">${DB.escape(s.category || '其他')}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <button onclick="openViewModal('${s.id}')" title="查看" style="font-size:13px;color:var(--research-ink-2);padding:4px 10px;border:1px solid var(--research-border);border-radius:var(--radius-md);background:transparent;cursor:pointer;font-family:var(--research-font-sans);display:flex;align-items:center;gap:4px;">
              <i data-lucide="eye" style="width:14px;height:14px;"></i>查看
            </button>
            <button onclick="openEditModal('${s.id}')" title="编辑" style="font-size:13px;color:var(--research-primary);padding:4px 10px;border:1px solid var(--research-border);border-radius:var(--radius-md);background:transparent;cursor:pointer;font-family:var(--research-font-sans);display:flex;align-items:center;gap:4px;">
              <i data-lucide="pencil" style="width:14px;height:14px;"></i>编辑
            </button>
            <button onclick="deleteScript('${s.id}')" title="删除" style="font-size:13px;color:var(--state-error);padding:4px 10px;border:1px solid var(--research-border);border-radius:var(--radius-md);background:transparent;cursor:pointer;font-family:var(--research-font-sans);display:flex;align-items:center;gap:4px;">
              <i data-lucide="trash-2" style="width:14px;height:14px;"></i>删除
            </button>
          </div>
        </div>
        ${s.description ? `<p style="font-size:14px;color:var(--research-ink-2);margin:8px 0;">${DB.escape(s.description)}</p>` : ''}
        ${s.code ? `<pre style="background:var(--research-surface-3);border-radius:var(--radius-md);padding:16px;font-family:var(--research-font-mono);font-size:13px;line-height:1.5;color:var(--research-ink-2);overflow:hidden;max-height:120px;white-space:pre-wrap;margin:0;">${escapedCode}${(s.code || '').length > 200 ? '\n…' : ''}</pre>` : ''}
        <div style="display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap;">
          <span style="font-size:13px;color:var(--research-ink-3);">${DB.formatDate(s.createdAt)}</span>
          ${keywords}
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
  lucide.createIcons();
  updateFooter(scripts.length);
}

// ---- 更新页脚 ----
function updateFooter(count) {
  document.getElementById('footer').textContent = `科研工作站 · 脚本仓库 · 共 ${count} 个脚本`;
}

// ---- 搜索输入 ----
function onSearchInput(val) {
  state.search = val;
  renderScriptList();
}

// ---- 语言筛选 ----
function onLangFilter(val) {
  state.langFilter = val;
  renderScriptList();
}

// ---- 分类筛选 ----
function onCatFilter(val) {
  state.catFilter = val;
  renderCategoryTree();
  renderScriptList();
}

// ---- 添加脚本弹窗 ----
function openAddModal() {
  const bodyHTML = getScriptFormHTML(null);
  const { close } = UI.modal('添加脚本', bodyHTML);

  // 绑定提交
  const form = document.getElementById('scriptForm');
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const data = getFormData();
    if (!data.title.trim()) {
      UI.toast('请输入脚本标题', 'error');
      return;
    }
    DB.add(DB.KEYS.SCRIPTS, data);
    UI.toast('脚本添加成功', 'success');
    close();
    refreshAll();
  });

  lucide.createIcons();
}

// ---- 编辑脚本弹窗 ----
function openEditModal(id) {
  const script = DB.get(DB.KEYS.SCRIPTS, id);
  if (!script) {
    UI.toast('脚本不存在', 'error');
    return;
  }

  const bodyHTML = getScriptFormHTML(script);
  const { close } = UI.modal('编辑脚本', bodyHTML);

  const form = document.getElementById('scriptForm');
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const data = getFormData();
    if (!data.title.trim()) {
      UI.toast('请输入脚本标题', 'error');
      return;
    }
    DB.update(DB.KEYS.SCRIPTS, id, data);
    UI.toast('脚本更新成功', 'success');
    close();
    refreshAll();
  });

  lucide.createIcons();
}

// ---- 查看详情弹窗 ----
function openViewModal(id) {
  const script = DB.get(DB.KEYS.SCRIPTS, id);
  if (!script) {
    UI.toast('脚本不存在', 'error');
    return;
  }

  const keywords = (script.keywords || []).map(kw => DB.escape(kw)).join('、');

  const bodyHTML = `
    <div style="display:flex;flex-direction:column;gap:16px;">
      <div>
        <div style="font-size:13px;font-weight:500;color:var(--research-ink-3);margin-bottom:4px;">标题</div>
        <div style="font-family:var(--research-font-mono);font-size:16px;font-weight:600;color:var(--research-ink);">${DB.escape(script.title || '未命名脚本')}</div>
      </div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;">
        <div>
          <div style="font-size:13px;font-weight:500;color:var(--research-ink-3);margin-bottom:4px;">语言</div>
          <span style="font-size:13px;padding:2px 10px;border-radius:var(--radius-sm);background:var(--research-surface-2);color:var(--research-ink-2);">${DB.escape(script.language || '其他')}</span>
        </div>
        <div>
          <div style="font-size:13px;font-weight:500;color:var(--research-ink-3);margin-bottom:4px;">分类</div>
          <span style="font-size:13px;padding:2px 10px;border-radius:var(--radius-sm);background:var(--research-surface-3);color:var(--research-ink-2);">${DB.escape(script.category || '其他')}</span>
        </div>
        <div>
          <div style="font-size:13px;font-weight:500;color:var(--research-ink-3);margin-bottom:4px;">创建时间</div>
          <span style="font-size:13px;color:var(--research-ink-2);">${DB.formatDate(script.createdAt)}</span>
        </div>
      </div>
      ${script.description ? `
      <div>
        <div style="font-size:13px;font-weight:500;color:var(--research-ink-3);margin-bottom:4px;">描述</div>
        <div style="font-size:14px;color:var(--research-ink-2);line-height:1.6;">${DB.escape(script.description)}</div>
      </div>` : ''}
      ${keywords ? `
      <div>
        <div style="font-size:13px;font-weight:500;color:var(--research-ink-3);margin-bottom:4px;">关键词</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${(script.keywords || []).map(kw => `<span style="background:var(--research-surface-2);color:var(--research-ink-2);font-size:12px;padding:2px 8px;border-radius:var(--radius-sm);">${DB.escape(kw)}</span>`).join('')}
        </div>
      </div>` : ''}
      ${script.code ? `
      <div>
        <div style="font-size:13px;font-weight:500;color:var(--research-ink-3);margin-bottom:8px;">代码</div>
        <pre style="background:var(--research-surface-3);border-radius:var(--radius-md);padding:16px;font-family:var(--research-font-mono);font-size:13px;line-height:1.5;color:var(--research-ink-2);overflow:auto;max-height:400px;white-space:pre-wrap;margin:0;">${DB.escape(script.code)}</pre>
      </div>` : ''}
    </div>
  `;

  UI.modal('查看脚本', bodyHTML);
  lucide.createIcons();
}

// ---- 删除脚本 ----
function deleteScript(id) {
  const script = DB.get(DB.KEYS.SCRIPTS, id);
  if (!script) {
    UI.toast('脚本不存在', 'error');
    return;
  }
  if (UI.confirm(`确定要删除脚本"${script.title || '未命名脚本'}"吗？`)) {
    DB.remove(DB.KEYS.SCRIPTS, id);
    UI.toast('脚本已删除', 'success');
    refreshAll();
  }
}

// ---- 表单 HTML ----
function getScriptFormHTML(script) {
  const s = script || {};
  const langOptions = LANGUAGES.map(l =>
    `<option value="${l}" ${s.language === l ? 'selected' : ''}>${l}</option>`
  ).join('');
  const catOptions = CATEGORIES.map(c =>
    `<option value="${c}" ${s.category === c ? 'selected' : ''}>${c}</option>`
  ).join('');

  return `
    <form id="scriptForm" style="display:flex;flex-direction:column;gap:16px;">
      <div>
        <label class="rw-label">标题 <span style="color:var(--state-error);">*</span></label>
        <input type="text" name="title" class="rw-input" placeholder="例如：bulk_RNA_seq_pipeline.py" value="${DB.escape(s.title || '')}" required>
      </div>
      <div>
        <label class="rw-label">描述</label>
        <textarea name="description" class="rw-input" rows="2" placeholder="简要描述脚本用途...">${DB.escape(s.description || '')}</textarea>
      </div>
      <div style="display:flex;gap:16px;">
        <div style="flex:1;">
          <label class="rw-label">语言</label>
          <select name="language" class="rw-input" style="cursor:pointer;">
            ${langOptions}
          </select>
        </div>
        <div style="flex:1;">
          <label class="rw-label">分类</label>
          <select name="category" class="rw-input" style="cursor:pointer;">
            ${catOptions}
          </select>
        </div>
      </div>
      <div>
        <label class="rw-label">代码</label>
        <textarea name="code" class="rw-input" rows="8" placeholder="粘贴脚本代码...">${DB.escape(s.code || '')}</textarea>
      </div>
      <div>
        <label class="rw-label">关键词</label>
        <input type="text" name="keywords" class="rw-input" placeholder="多个关键词用逗号分隔" value="${DB.escape((s.keywords || []).join(', '))}">
      </div>
      <div style="display:flex;justify-content:flex-end;gap:12px;margin-top:8px;">
        <button type="button" class="modal-close" style="padding:8px 20px;border-radius:var(--radius-md);font-size:14px;border:1px solid var(--research-border);background:transparent;color:var(--research-ink-2);cursor:pointer;font-family:var(--research-font-sans);">取消</button>
        <button type="submit" style="padding:8px 20px;border-radius:var(--radius-md);font-size:14px;font-weight:500;border:none;background:var(--research-primary);color:var(--research-primary-foreground);cursor:pointer;font-family:var(--research-font-sans);">${script ? '保存修改' : '添加脚本'}</button>
      </div>
    </form>
  `;
}

// ---- 获取表单数据 ----
function getFormData() {
  const form = document.getElementById('scriptForm');
  return {
    title: form.title.value.trim(),
    description: form.description.value.trim(),
    language: form.language.value,
    category: form.category.value,
    code: form.code.value,
    keywords: form.keywords.value
      .split(',')
      .map(k => k.trim())
      .filter(k => k.length > 0)
  };
}

// ---- 刷新全部 ----
function refreshAll() {
  renderCategoryTree();
  renderScriptList();
}

// ---- 初始化 ----
(function init() {

  const existing = getAllScripts();
  if (existing.length === 0) {
    const samples = [
      {

</script>
