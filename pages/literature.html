/* ============================================================
   Research Workstation — Warm Editorial Theme
   科研暖色编辑风格 · 琥珀赭色系
   ============================================================ */

/* ---- Brand Prefix: research ---- */

:root {
  /* ---- Primary Brand Hue (Amber/Ochre) ---- */
  --color-brand-50: #FBF4E8;
  --color-brand-100: #F5E6CC;
  --color-brand-200: #EBCFA0;
  --color-brand-300: #DDB26E;
  --color-brand-400: #C99542;
  --color-brand-500: #B8770C;
  --color-brand-600: #A06608;
  --color-brand-700: #84540A;
  --color-brand-800: #6B450C;
  --color-brand-900: #543708;

  /* ---- Neutral Scale (Warm) ---- */
  --color-neutral-50: #FAF7F2;
  --color-neutral-100: #F5F1EB;
  --color-neutral-200: #E8E2D8;
  --color-neutral-300: #D4CCC0;
  --color-neutral-400: #B0A89C;
  --color-neutral-500: #8A8275;
  --color-neutral-600: #6B6357;
  --color-neutral-700: #4D463C;
  --color-neutral-800: #363028;
  --color-neutral-900: #241F1A;

  /* ---- Semantic Aliases (Light Mode) ---- */
  --research-background: #FAF7F2;
  --research-foreground: #241F1A;
  --research-card: #FFFFFF;
  --research-card-foreground: #241F1A;
  --research-popover: #FFFFFF;
  --research-popover-foreground: #241F1A;
  --research-primary: #B8770C;
  --research-primary-foreground: #FFFFFF;
  --research-muted: #F5F1EB;
  --research-muted-foreground: #6B6357;
  --research-border: #E8E2D8;
  --research-input: #E8E2D8;
  --research-ring: #B8770C;

  /* ---- Surface Tokens ---- */
  --research-surface: #FFFFFF;
  --research-surface-2: #F5F1EB;
  --research-surface-3: #EFE9DF;

  /* ---- Ink Tokens ---- */
  --research-ink: #241F1A;
  --research-ink-2: #4D463C;
  --research-ink-3: #8A8275;

  /* ---- Line Token ---- */
  --research-line: #E8E2D8;

  /* ---- Radius Scale ---- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  --research-radius-small: 4px;
  --research-radius-medium: 8px;
  --research-radius-large: 16px;

  /* ---- Shadow Scale ---- */
  --research-shadow-1: 0 1px 2px rgba(36, 31, 26, 0.04), 0 1px 1px rgba(36, 31, 26, 0.02);
  --research-shadow-floating: 0 8px 24px -8px rgba(36, 31, 26, 0.12);
  --research-shadow-modal: 0 24px 60px -20px rgba(36, 31, 26, 0.20);

  /* ---- Spacing Scale (8pt grid) ---- */
  --research-s-1: 4px;
  --research-s-2: 8px;
  --research-s-3: 12px;
  --research-s-4: 16px;
  --research-s-5: 24px;
  --research-s-6: 32px;
  --research-s-7: 48px;
  --research-s-8: 80px;

  /* ---- State Colors ---- */
  --state-success: #4A7C4A;
  --state-warning: #C99542;
  --state-error: #B0454B;
  --state-info: #4A6B8A;

  /* ---- Typography ---- */
  --research-font-serif: "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
  --research-font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --research-font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", monospace;

  /* ---- Color alias for general use ---- */
  --research-brand: #B8770C;
  --research-brand-ink: #FFFFFF;
}

/* ---- Dark Mode ---- */
.dark {
  --research-background: #1A1612;
  --research-foreground: #E8E2D8;
  --research-card: #241F1A;
  --research-card-foreground: #E8E2D8;
  --research-popover: #2A241E;
  --research-popover-foreground: #E8E2D8;
  --research-primary: #C99542;
  --research-primary-foreground: #1A1612;
  --research-muted: #2A241E;
  --research-muted-foreground: #B0A89C;
  --research-border: #363028;
  --research-input: #363028;
  --research-ring: #C99542;

  --research-surface: #241F1A;
  --research-surface-2: #2A241E;
  --research-surface-3: #363028;

  --research-ink: #E8E2D8;
  --research-ink-2: #B0A89C;

  --state-error: #D06870;
  --state-info: #7A9CBA;

  --research-brand: #C99542;
  --research-brand-ink: #1A1612;
}

    <script>
    (function() {
      'use strict';

      // ---- State ----
      let searchQuery = '';
      let statusFilter = 'all';
      let keywordFilter = '';

      // ---- Status config ----
      const STATUS_MAP = {
        'unread':  { label: '待读',   color: 'var(--state-warning)' },
        'reading': { label: '阅读中', color: 'var(--state-info)' },
        'read':    { label: '已读',   color: 'var(--state-success)' }
      };

      // ---- Helpers ----
      function getAllLiterature() {
        return DB.getAll(DB.KEYS.LITERATURE);
      }

      function countNotes(notes) {
        if (!notes) return 0;
        if (Array.isArray(notes)) return notes.length;
        return String(notes).trim() ? 1 : 0;
      }

      function getNotesText(notes) {
        if (!notes) return '';
        if (Array.isArray(notes)) return notes.join('\n');
        return String(notes);
      }

      function getAllKeywords() {
        const items = getAllLiterature();
        const set = new Set();
        items.forEach(l => {
          (l.keywords || []).forEach(kw => {
            if (kw && kw.trim()) set.add(kw.trim());
          });
        });
        return Array.from(set).sort();
      }

      function getFilteredLiterature() {
        let items = getAllLiterature();
        // Status filter
        if (statusFilter !== 'all') {
          items = items.filter(l => (l.status || 'unread') === statusFilter);
        }
        // Keyword filter
        if (keywordFilter) {
          items = items.filter(l => (l.keywords || []).includes(keywordFilter));
        }
        // Search
        if (searchQuery.trim()) {
          const q = searchQuery.trim().toLowerCase();
          items = items.filter(l => {
            const title = (l.title || '').toLowerCase();
            const authors = (l.authors || '').toLowerCase();
            const kws = (l.keywords || []).join(' ').toLowerCase();
            return title.includes(q) || authors.includes(q) || kws.includes(q);
          });
        }
        return items;
      }

      // ---- Rendering ----
      function renderFilterBar() {
        const bar = document.getElementById('lit-filter-bar');
        const allItems = getAllLiterature();
        const counts = {
          all: allItems.length,
          unread: allItems.filter(l => (l.status || 'unread') === 'unread').length,
          reading: allItems.filter(l => l.status === 'reading').length,
          read: allItems.filter(l => l.status === 'read').length
        };

        const statusChips = [
          { key: 'all', label: '全部', count: counts.all },
          { key: 'unread', label: '待读', count: counts.unread },
          { key: 'reading', label: '阅读中', count: counts.reading },
          { key: 'read', label: '已读', count: counts.read }
        ];

        let html = '';
        statusChips.forEach(s => {
          const active = statusFilter === s.key;
          const bg = active ? 'var(--research-primary)' : 'var(--research-surface)';
          const color = active ? 'var(--research-primary-foreground)' : 'var(--research-ink-2)';
          const border = active ? 'var(--research-primary)' : 'var(--research-border)';
          html += `<span class="lit-filter-chip" data-status="${s.key}" style="background-color:${bg};border:1px solid ${border};color:${color};padding:6px 14px;border-radius:var(--radius-full);font-size:13px;display:inline-flex;align-items:center;gap:6px;">${s.label} <span style="opacity:0.7;font-size:12px;">${s.count}</span></span>`;
        });

        // Keyword filter
        const keywords = getAllKeywords();
        if (keywords.length > 0) {
          html += `<span style="width:1px;background-color:var(--research-border);margin:4px 8px;"></span>`;
          if (keywordFilter) {
            html += `<span class="lit-filter-chip" data-keyword="" style="background-color:var(--research-surface-3);border:1px solid var(--research-border);color:var(--research-ink-2);padding:6px 14px;border-radius:var(--radius-full);font-size:13px;">清除筛选</span>`;
          }
          keywords.slice(0, 12).forEach(kw => {
            const active = keywordFilter === kw;
            const bg = active ? 'var(--research-primary)' : 'var(--research-surface)';
            const color = active ? 'var(--research-primary-foreground)' : 'var(--research-ink-2)';
            const border = active ? 'var(--research-primary)' : 'var(--research-border)';
            html += `<span class="lit-filter-chip" data-keyword="${DB.escape(kw)}" style="background-color:${bg};border:1px solid ${border};color:${color};padding:6px 14px;border-radius:var(--radius-full);font-size:13px;">${DB.escape(kw)}</span>`;
          });
          if (keywords.length > 12) {
            html += `<span style="font-size:12px;color:var(--research-ink-3);padding:6px 8px;">等 ${keywords.length} 个关键词</span>`;
          }
        }

        bar.innerHTML = html;

        // Bind events
        bar.querySelectorAll('[data-status]').forEach(el => {
          el.addEventListener('click', function() {
            statusFilter = this.getAttribute('data-status');
            renderAll();
          });
        });
        bar.querySelectorAll('[data-keyword]').forEach(el => {
          el.addEventListener('click', function() {
            keywordFilter = this.getAttribute('data-keyword');
            renderAll();
          });
        });
      }

      function renderStats() {
        const items = getAllLiterature();
        const unread = items.filter(l => (l.status || 'unread') === 'unread').length;
        const reading = items.filter(l => l.status === 'reading').length;
        const read = items.filter(l => l.status === 'read').length;
        const stats = document.getElementById('lit-stats');
        stats.innerHTML = `
          <div class="flex flex-col">
            <span style="font-family:var(--research-font-serif);font-size:28px;font-weight:600;color:var(--research-ink);line-height:1.1;">${items.length} 篇</span>
            <span style="font-size:13px;color:var(--research-ink-3);margin-top:4px;">总文献</span>
          </div>
          <div class="flex flex-col">
            <span style="font-family:var(--research-font-serif);font-size:28px;font-weight:600;color:var(--research-ink);line-height:1.1;">${unread} 篇</span>
            <span style="font-size:13px;color:var(--research-ink-3);margin-top:4px;">待读</span>
          </div>
          <div class="flex flex-col">
            <span style="font-family:var(--research-font-serif);font-size:28px;font-weight:600;color:var(--research-ink);line-height:1.1;">${reading} 篇</span>
            <span style="font-size:13px;color:var(--research-ink-3);margin-top:4px;">阅读中</span>
          </div>
          <div class="flex flex-col">
            <span style="font-family:var(--research-font-serif);font-size:28px;font-weight:600;color:var(--research-ink);line-height:1.1;">${read} 篇</span>
            <span style="font-size:13px;color:var(--research-ink-3);margin-top:4px;">已读</span>
          </div>
        `;
      }

      function renderList() {
        const items = getFilteredLiterature();
        const list = document.getElementById('lit-list');
        const empty = document.getElementById('lit-empty');
        const footer = document.getElementById('lit-footer');

        if (items.length === 0) {
          list.innerHTML = '';
          list.style.display = 'none';
          empty.style.display = 'block';
          footer.textContent = '科研工作站 · 文献阅读 · 共 0 篇';
          return;
        }

        list.style.display = 'grid';
        empty.style.display = 'none';

        list.innerHTML = items.map(function(l) {
          const status = STATUS_MAP[l.status || 'unread'] || STATUS_MAP['unread'];
          const noteCount = countNotes(l.notes);
          const journalYear = [l.journal, l.year].filter(Boolean).join(', ');
          const kws = (l.keywords || []).map(function(kw) {
            return `<span style="background-color:var(--research-surface-2);color:var(--research-ink-2);padding:2px 8px;border-radius:var(--radius-sm);font-size:12px;">${DB.escape(kw)}</span>`;
          }).join('');

          return `
            <div class="flex flex-col" style="gap:12px;background-color:var(--research-card);border:1px solid var(--research-border);border-radius:var(--radius-lg);padding:20px;" data-id="${DB.escape(l.id)}">
              <div class="flex justify-between items-start">
                <div style="flex:1;min-width:0;">
                  <h3 style="font-family:var(--research-font-serif);font-size:15px;font-weight:600;color:var(--research-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4;">${DB.escape(l.title || '无标题')}</h3>
                  ${journalYear ? `<span style="font-size:13px;color:var(--research-ink-3);">${DB.escape(journalYear)}</span>` : ''}
                </div>
                <span style="background-color:${status.color};color:var(--research-primary-foreground);padding:2px 8px;border-radius:var(--radius-sm);font-size:12px;white-space:nowrap;">${status.label}</span>
              </div>
              ${l.authors ? `<div style="font-size:13px;color:var(--research-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${DB.escape(l.authors)}</div>` : ''}
              ${kws ? `<div class="flex flex-wrap" style="gap:6px;">${kws}</div>` : ''}
              <div class="flex justify-between items-center" style="margin-top:auto;">
                <span class="flex items-center" style="gap:4px;font-size:13px;color:var(--research-ink-3);"><i data-lucide="sticky-note" style="width:14px;height:14px;"></i>笔记 ${noteCount} 条</span>
                <div class="flex" style="gap:6px;">
                  <button class="lit-card-action primary" data-action="view" data-id="${DB.escape(l.id)}"><i data-lucide="eye" style="width:13px;height:13px;"></i>查看</button>
                  <button class="lit-card-action" data-action="edit" data-id="${DB.escape(l.id)}"><i data-lucide="pencil" style="width:13px;height:13px;"></i>编辑</button>
                  <button class="lit-card-action danger" data-action="delete" data-id="${DB.escape(l.id)}"><i data-lucide="trash-2" style="width:13px;height:13px;"></i>删除</button>
                </div>
              </div>
            </div>
          `;
        }).join('');

        footer.textContent = '科研工作站 · 文献阅读 · 共 ' + items.length + ' 篇';

        // Bind card actions
        list.querySelectorAll('[data-action]').forEach(function(btn) {
          btn.addEventListener('click', function(e) {
            e.preventDefault();
            const action = this.getAttribute('data-action');
            const id = this.getAttribute('data-id');
            if (action === 'view') showDetail(id);
            else if (action === 'edit') showEditForm(id);
            else if (action === 'delete') deleteLiterature(id);
          });
        });

        // Re-create icons
        if (window.lucide) lucide.createIcons();
      }

      function renderAll() {
        renderFilterBar();
        renderStats();
        renderList();
        if (window.lucide) lucide.createIcons();
      }

      // ---- Forms ----
      function showAddForm() {
        showEditForm(null);
      }

      function showEditForm(id) {
        const isEdit = !!id;
        const item = isEdit ? DB.get(DB.KEYS.LITERATURE, id) : {
          title: '', authors: '', journal: '', year: '', status: 'unread',
          doi: '', pdfUrl: '', keywords: [], notes: ''
        };
        if (isEdit && !item) {
          UI.toast('未找到该文献', 'error');
          return;
        }

        const kwsStr = (item.keywords || []).join(', ');
        const notesStr = getNotesText(item.notes);

        const bodyHTML = `
          <div style="display:flex;flex-direction:column;gap:16px;">
            <div>
              <label class="lit-form-label">标题 *</label>
              <input class="lit-form-input" id="lf-title" type="text" value="${DB.escape(item.title || '')}" placeholder="文献标题">
            </div>
            <div>
              <label class="lit-form-label">作者</label>
              <input class="lit-form-input" id="lf-authors" type="text" value="${DB.escape(item.authors || '')}" placeholder="作者列表">
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
              <div>
                <label class="lit-form-label">期刊</label>
                <input class="lit-form-input" id="lf-journal" type="text" value="${DB.escape(item.journal || '')}" placeholder="期刊名称">
              </div>
              <div>
                <label class="lit-form-label">年份</label>
                <input class="lit-form-input" id="lf-year" type="text" value="${DB.escape(item.year || '')}" placeholder="2024">
              </div>
            </div>
            <div>
              <label class="lit-form-label">阅读状态</label>
              <select class="lit-form-input" id="lf-status">
                <option value="unread" ${item.status==='unread'?'selected':''}>待读</option>
                <option value="reading" ${item.status==='reading'?'selected':''}>阅读中</option>
                <option value="read" ${item.status==='read'?'selected':''}>已读</option>
              </select>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
              <div>
                <label class="lit-form-label">DOI</label>
                <input class="lit-form-input" id="lf-doi" type="text" value="${DB.escape(item.doi || '')}" placeholder="10.xxxx/xxxxx">
              </div>
              <div>
                <label class="lit-form-label">PDF 链接</label>
                <input class="lit-form-input" id="lf-pdfurl" type="text" value="${DB.escape(item.pdfUrl || '')}" placeholder="https://...">
              </div>
            </div>
            <div>
              <label class="lit-form-label">关键词（逗号分隔）</label>
              <input class="lit-form-input" id="lf-keywords" type="text" value="${DB.escape(kwsStr)}" placeholder="单细胞, 肿瘤血管, 内皮细胞">
            </div>
            <div>
              <label class="lit-form-label">笔记</label>
              <textarea class="lit-form-input lit-form-textarea" id="lf-notes" placeholder="记录你的阅读笔记...">${DB.escape(notesStr)}</textarea>
            </div>
            <div class="flex justify-end" style="gap:8px;margin-top:8px;">
              <button class="lit-btn-secondary" id="lf-cancel">取消</button>
              <button class="lit-btn-primary" id="lf-save">${isEdit ? '保存修改' : '添加'}</button>
            </div>
          </div>
        `;

        const m = UI.modal(isEdit ? '编辑文献' : '添加文献', bodyHTML);
        const overlay = m.overlay;

        overlay.querySelector('#lf-cancel').addEventListener('click', function() { m.close(); });
        overlay.querySelector('#lf-save').addEventListener('click', function() {
          const title = overlay.querySelector('#lf-title').value.trim();
          if (!title) {
            UI.toast('请输入文献标题', 'error');
            return;
          }
          const data = {
            title: title,
            authors: overlay.querySelector('#lf-authors').value.trim(),
            journal: overlay.querySelector('#lf-journal').value.trim(),
            year: overlay.querySelector('#lf-year').value.trim(),
            status: overlay.querySelector('#lf-status').value,
            doi: overlay.querySelector('#lf-doi').value.trim(),
            pdfUrl: overlay.querySelector('#lf-pdfurl').value.trim(),
            keywords: overlay.querySelector('#lf-keywords').value.split(',').map(function(s){return s.trim();}).filter(Boolean),
            notes: overlay.querySelector('#lf-notes').value.trim()
          };
          if (isEdit) {
            DB.update(DB.KEYS.LITERATURE, id, data);
            UI.toast('文献已更新');
          } else {
            DB.add(DB.KEYS.LITERATURE, data);
            UI.toast('文献已添加');
          }
          m.close();
          renderAll();
        });

        // Focus title
        setTimeout(function() { overlay.querySelector('#lf-title').focus(); }, 50);
      }

      function showDetail(id) {
        const item = DB.get(DB.KEYS.LITERATURE, id);
        if (!item) {
          UI.toast('未找到该文献', 'error');
          return;
        }
        const status = STATUS_MAP[item.status || 'unread'] || STATUS_MAP['unread'];
        const kws = (item.keywords || []).map(function(kw) {
          return `<span style="background-color:var(--research-surface-2);color:var(--research-ink-2);padding:2px 8px;border-radius:var(--radius-sm);font-size:12px;">${DB.escape(kw)}</span>`;
        }).join('');
        const notesText = getNotesText(item.notes);
        const rows = [
          { label: '作者', value: item.authors || '—' },
          { label: '期刊', value: item.journal || '—' },
          { label: '年份', value: item.year || '—' },
          { label: 'DOI', value: item.doi || '—' },
          { label: 'PDF 链接', value: item.pdfUrl ? `<a href="${DB.escape(item.pdfUrl)}" target="_blank" style="color:var(--research-primary);">${DB.escape(item.pdfUrl)}</a>` : '—' },
          { label: '添加时间', value: DB.formatDate(item.createdAt) },
          { label: '更新时间', value: DB.formatDate(item.updatedAt) }
        ];

        const bodyHTML = `
          <div style="display:flex;flex-direction:column;gap:20px;">
            <div>
              <div class="flex items-center" style="gap:8px;margin-bottom:8px;">
                <span style="background-color:${status.color};color:var(--research-primary-foreground);padding:2px 8px;border-radius:var(--radius-sm);font-size:12px;">${status.label}</span>
              </div>
              <h3 style="font-family:var(--research-font-serif);font-size:18px;font-weight:600;color:var(--research-ink);line-height:1.4;">${DB.escape(item.title || '无标题')}</h3>
            </div>
            ${kws ? `<div class="flex flex-wrap" style="gap:6px;">${kws}</div>` : ''}
            <div style="display:flex;flex-direction:column;gap:12px;">
              ${rows.map(function(r) {
                return `<div style="display:flex;gap:12px;font-size:14px;border-bottom:1px solid var(--research-border);padding-bottom:8px;">
                  <span style="width:80px;color:var(--research-ink-3);flex-shrink:0;">${r.label}</span>
                  <span style="color:var(--research-ink);flex:1;word-break:break-all;">${r.value}</span>
                </div>`;
              }).join('')}
            </div>
            <div>
              <div style="font-size:13px;font-weight:500;color:var(--research-ink-2);margin-bottom:8px;">笔记</div>
              <div style="background-color:var(--research-surface-2);border-radius:var(--radius-md);padding:12px 16px;font-size:14px;color:var(--research-ink-2);line-height:1.6;white-space:pre-wrap;">${notesText ? DB.escape(notesText) : '<span style="color:var(--research-ink-3);">暂无笔记</span>'}</div>
            </div>
            <div class="flex justify-end" style="gap:8px;">
              <button class="lit-btn-secondary" id="ld-close">关闭</button>
              <button class="lit-btn-primary" id="ld-edit">编辑</button>
            </div>
          </div>
        `;

        const m = UI.modal('文献详情', bodyHTML);
        m.overlay.querySelector('#ld-close').addEventListener('click', function() { m.close(); });
        m.overlay.querySelector('#ld-edit').addEventListener('click', function() {
          m.close();
          showEditForm(id);
        });
      }

      function deleteLiterature(id) {
        const item = DB.get(DB.KEYS.LITERATURE, id);
        if (!item) return;
        if (UI.confirm('确定要删除文献「' + (item.title || '无标题') + '」吗？此操作不可撤销。')) {
          DB.remove(DB.KEYS.LITERATURE, id);
          UI.toast('文献已删除');
          renderAll();
        }
      }

      // ---- Init ----
      function init() {
        // Bind search
        const searchInput = document.getElementById('lit-search');
        searchInput.addEventListener('input', function() {
          searchQuery = this.value;
          renderList();
        });

        // Bind add buttons
        document.getElementById('lit-add-btn').addEventListener('click', showAddForm);
        document.getElementById('lit-empty-add').addEventListener('click', showAddForm);

        // Initial render
        renderAll();
      }

      // Run on DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
    </script>
</body>
</html>
