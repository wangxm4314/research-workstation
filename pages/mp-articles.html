/* ============================================================
   Research Workstation — Warm Editorial Theme
   科研暖色编辑风格 · 琥珀赭色系
   ============================================================ */

/* ---- Brand Prefix: research ---- */

:root {
  /* ---- Primary Brand Hue (Amber/Ochre) ---- */
  --color-brand-50: #FBF4E8;
  --color-brand-100: #F5E6CC;
  --color-brand-200: #EBCFA0;
  --color-brand-300: #DDB26E;
  --color-brand-400: #C99542;
  --color-brand-500: #B8770C;
  --color-brand-600: #A06608;
  --color-brand-700: #84540A;
  --color-brand-800: #6B450C;
  --color-brand-900: #543708;

  /* ---- Neutral Scale (Warm) ---- */
  --color-neutral-50: #FAF7F2;
  --color-neutral-100: #F5F1EB;
  --color-neutral-200: #E8E2D8;
  --color-neutral-300: #D4CCC0;
  --color-neutral-400: #B0A89C;
  --color-neutral-500: #8A8275;
  --color-neutral-600: #6B6357;
  --color-neutral-700: #4D463C;
  --color-neutral-800: #363028;
  --color-neutral-900: #241F1A;

  /* ---- Semantic Aliases (Light Mode) ---- */
  --research-background: #FAF7F2;
  --research-foreground: #241F1A;
  --research-card: #FFFFFF;
  --research-card-foreground: #241F1A;
  --research-popover: #FFFFFF;
  --research-popover-foreground: #241F1A;
  --research-primary: #B8770C;
  --research-primary-foreground: #FFFFFF;
  --research-muted: #F5F1EB;
  --research-muted-foreground: #6B6357;
  --research-border: #E8E2D8;
  --research-input: #E8E2D8;
  --research-ring: #B8770C;

  /* ---- Surface Tokens ---- */
  --research-surface: #FFFFFF;
  --research-surface-2: #F5F1EB;
  --research-surface-3: #EFE9DF;

  /* ---- Ink Tokens ---- */
  --research-ink: #241F1A;
  --research-ink-2: #4D463C;
  --research-ink-3: #8A8275;

  /* ---- Line Token ---- */
  --research-line: #E8E2D8;

  /* ---- Radius Scale ---- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  --research-radius-small: 4px;
  --research-radius-medium: 8px;
  --research-radius-large: 16px;

  /* ---- Shadow Scale ---- */
  --research-shadow-1: 0 1px 2px rgba(36, 31, 26, 0.04), 0 1px 1px rgba(36, 31, 26, 0.02);
  --research-shadow-floating: 0 8px 24px -8px rgba(36, 31, 26, 0.12);
  --research-shadow-modal: 0 24px 60px -20px rgba(36, 31, 26, 0.20);

  /* ---- Spacing Scale (8pt grid) ---- */
  --research-s-1: 4px;
  --research-s-2: 8px;
  --research-s-3: 12px;
  --research-s-4: 16px;
  --research-s-5: 24px;
  --research-s-6: 32px;
  --research-s-7: 48px;
  --research-s-8: 80px;

  /* ---- State Colors ---- */
  --state-success: #4A7C4A;
  --state-warning: #C99542;
  --state-error: #B0454B;
  --state-info: #4A6B8A;

  /* ---- Typography ---- */
  --research-font-serif: "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
  --research-font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --research-font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", monospace;

  /* ---- Color alias for general use ---- */
  --research-brand: #B8770C;
  --research-brand-ink: #FFFFFF;
}

/* ---- Dark Mode ---- */
.dark {
  --research-background: #1A1612;
  --research-foreground: #E8E2D8;
  --research-card: #241F1A;
  --research-card-foreground: #E8E2D8;
  --research-popover: #2A241E;
  --research-popover-foreground: #E8E2D8;
  --research-primary: #C99542;
  --research-primary-foreground: #1A1612;
  --research-muted: #2A241E;
  --research-muted-foreground: #B0A89C;
  --research-border: #363028;
  --research-input: #363028;
  --research-ring: #C99542;

  --research-surface: #241F1A;
  --research-surface-2: #2A241E;
  --research-surface-3: #363028;

  --research-ink: #E8E2D8;
  --research-ink-2: #B0A89C;
  --research-ink-3: #8A8275;

  --research-line: #363028;

  --state-success: #6B9C6B;
  --state-warning: #DDB26E;
  --state-error: #D06870;
  --state-info: #7A9CBA;

  --research-brand: #C99542;
  --research-brand-ink: #1A1612;
}

    <script>
    /* ============================================================
       公众号推文管理 — CRUD 逻辑
       ============================================================ */

    const STATUS_META = {
      draft:     { label: '草稿',   bg: 'rgba(201,149,66,0.1)',  color: 'var(--state-warning)' },
      published: { label: '已发布', bg: 'rgba(74,124,74,0.1)',   color: 'var(--state-success)' },
      scheduled: { label: '定时发布', bg: 'rgba(74,107,138,0.1)', color: 'var(--state-info)' },
    };

    // 当前状态
    let currentSearch = '';
    let currentFilter = 'all';

    // 获取经过筛选的推文列表
    function getFilteredArticles() {
      let items = DB.getAll(DB.KEYS.ARTICLES);
      // 状态筛选
      if (currentFilter !== 'all') {
        items = items.filter(a => (a.status || 'draft') === currentFilter);
      }
      // 搜索筛选
      if (currentSearch.trim()) {
        const q = currentSearch.trim().toLowerCase();
        items = items.filter(a =>
          (a.title || '').toLowerCase().includes(q) ||
          (a.summary || '').toLowerCase().includes(q)
        );
      }
      return items;
    }

    // 渲染卡片列表
    function renderList() {
      const listEl   = document.getElementById('rw-article-list');
      const emptyEl  = document.getElementById('rw-empty-state');
      const countEl  = document.getElementById('rw-count');
      const articles = getFilteredArticles();

      // 更新总数（不受筛选影响）
      countEl.textContent = DB.getAll(DB.KEYS.ARTICLES).length;

      if (articles.length === 0) {
        listEl.innerHTML = '';
        listEl.style.display = 'none';
        emptyEl.style.display = 'flex';
        lucide.createIcons();
        return;
      }

      emptyEl.style.display = 'none';
      listEl.style.display = 'flex';
      listEl.innerHTML = '';

      articles.forEach(a => {
        const status = STATUS_META[a.status] || STATUS_META.draft;
        const keywords = (a.keywords || []).map(kw =>
          `<span style="padding:2px 8px; border-radius:var(--radius-sm); font-size:12px; background:var(--research-surface-2); color:var(--research-ink-2); font-family:var(--research-font-sans);">${DB.escape(kw)}</span>`
        ).join('');
        const dateStr = DB.formatDate(a.publishDate);

        const card = document.createElement('article');
        card.className = 'rw-card';
        card.style.cssText = 'background:var(--research-card); border:1px solid var(--research-border); border-radius:var(--radius-lg); padding:24px; display:flex; gap:20px; box-shadow:var(--research-shadow-1);';
        card.innerHTML = `
          <div style="width:120px; height:90px; background:var(--research-surface-3); border-radius:var(--radius-md); flex-shrink:0; display:flex; align-items:center; justify-content:center;">
            <i data-lucide="file-text" style="width:32px; height:32px; color:var(--research-ink-3);"></i>
          </div>
          <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
              <h2 style="font-family:var(--research-font-serif); font-size:16px; font-weight:600; color:var(--research-ink); margin:0;">${DB.escape(a.title || '无标题')}</h2>
              <span style="padding:3px 10px; border-radius:var(--radius-full); font-size:12px; background:${status.bg}; color:${status.color}; font-family:var(--research-font-sans); white-space:nowrap;">${status.label}</span>
            </div>
            <p style="font-size:14px; color:var(--research-ink-2); line-height:1.5; margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${DB.escape(a.summary || '')}</p>
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
              ${dateStr ? `<span style="font-size:13px; color:var(--research-ink-3); font-family:var(--research-font-sans);">${dateStr}</span>` : ''}
              ${keywords}
              <div style="margin-left:auto; display:flex; gap:8px;">
                <button class="rw-btn-edit rw-btn" data-id="${a.id}" style="background:var(--research-surface-2); color:var(--research-ink-2); padding:6px 12px; border-radius:var(--radius-sm); font-size:13px; border:1px solid var(--research-border); cursor:pointer; font-family:var(--research-font-sans); display:flex; align-items:center; gap:4px;">
                  <i data-lucide="pencil" style="width:14px; height:14px;"></i>编辑
                </button>
                <button class="rw-btn-delete rw-btn" data-id="${a.id}" style="background:rgba(176,69,75,0.08); color:var(--state-error); padding:6px 12px; border-radius:var(--radius-sm); font-size:13px; border:1px solid rgba(176,69,75,0.2); cursor:pointer; font-family:var(--research-font-sans); display:flex; align-items:center; gap:4px;">
                  <i data-lucide="trash-2" style="width:14px; height:14px;"></i>删除
                </button>
              </div>
            </div>
          </div>
        `;
        listEl.appendChild(card);
      });

      // 绑定编辑/删除事件
      listEl.querySelectorAll('.rw-btn-edit').forEach(btn => {
        btn.addEventListener('click', () => openEditModal(btn.dataset.id));
      });
      listEl.querySelectorAll('.rw-btn-delete').forEach(btn => {
        btn.addEventListener('click', () => deleteArticle(btn.dataset.id));
      });

      lucide.createIcons();
    }

    // 弹出新建/编辑表单
    function openCreateModal() {
      openFormModal(null);
    }

    function openEditModal(id) {
      const article = DB.get(DB.KEYS.ARTICLES, id);
      if (!article) {
        UI.toast('未找到该推文', 'error');
        return;
      }
      openFormModal(article);
    }

    function openFormModal(article) {
      const isEdit = !!article;
      const a = article || {};

      const bodyHTML = `
        <div style="display:flex; flex-direction:column; gap:20px;">
          <div>
            <label style="display:block; font-size:13px; font-weight:500; color:var(--research-ink-2); margin-bottom:6px; font-family:var(--research-font-sans);">标题 <span style="color:var(--state-error);">*</span></label>
            <input id="rw-f-title" type="text" value="${DB.escape(a.title || '')}" placeholder="请输入推文标题" style="width:100%; padding:8px 12px; border:1px solid var(--research-border); border-radius:var(--radius-md); background:var(--research-surface); font-size:14px; color:var(--research-ink); font-family:var(--research-font-sans); outline:none; box-sizing:border-box;" />
          </div>
          <div>
            <label style="display:block; font-size:13px; font-weight:500; color:var(--research-ink-2); margin-bottom:6px; font-family:var(--research-font-sans);">摘要</label>
            <input id="rw-f-summary" type="text" value="${DB.escape(a.summary || '')}" placeholder="一句话概括推文内容" style="width:100%; padding:8px 12px; border:1px solid var(--research-border); border-radius:var(--radius-md); background:var(--research-surface); font-size:14px; color:var(--research-ink); font-family:var(--research-font-sans); outline:none; box-sizing:border-box;" />
          </div>
          <div>
            <label style="display:block; font-size:13px; font-weight:500; color:var(--research-ink-2); margin-bottom:6px; font-family:var(--research-font-sans);">正文内容</label>
            <textarea id="rw-f-content" rows="5" placeholder="请输入正文内容..." style="width:100%; padding:8px 12px; border:1px solid var(--research-border); border-radius:var(--radius-md); background:var(--research-surface); font-size:14px; color:var(--research-ink); font-family:var(--research-font-sans); outline:none; box-sizing:border-box; resize:vertical;">${DB.escape(a.content || '')}</textarea>
          </div>
          <div>
            <label style="display:block; font-size:13px; font-weight:500; color:var(--research-ink-2); margin-bottom:6px; font-family:var(--research-font-sans);">关键词 <span style="color:var(--research-ink-3); font-weight:400;">（逗号分隔）</span></label>
            <input id="rw-f-keywords" type="text" value="${DB.escape((a.keywords || []).join(', '))}" placeholder="CRISPR, 基因编辑, 分子生物学" style="width:100%; padding:8px 12px; border:1px solid var(--research-border); border-radius:var(--radius-md); background:var(--research-surface); font-size:14px; color:var(--research-ink); font-family:var(--research-font-sans); outline:none; box-sizing:border-box;" />
          </div>
          <div style="display:flex; gap:16px;">
            <div style="flex:1;">
              <label style="display:block; font-size:13px; font-weight:500; color:var(--research-ink-2); margin-bottom:6px; font-family:var(--research-font-sans);">状态</label>
              <select id="rw-f-status" style="width:100%; padding:8px 12px; border:1px solid var(--research-border); border-radius:var(--radius-md); background:var(--research-surface); font-size:14px; color:var(--research-ink); font-family:var(--research-font-sans); outline:none; cursor:pointer; box-sizing:border-box;">
                <option value="draft" ${(a.status || 'draft') === 'draft' ? 'selected' : ''}>草稿</option>
                <option value="published" ${a.status === 'published' ? 'selected' : ''}>已发布</option>
                <option value="scheduled" ${a.status === 'scheduled' ? 'selected' : ''}>定时发布</option>
              </select>
            </div>
            <div style="flex:1;">
              <label style="display:block; font-size:13px; font-weight:500; color:var(--research-ink-2); margin-bottom:6px; font-family:var(--research-font-sans);">发布日期</label>
              <input id="rw-f-date" type="date" value="${a.publishDate ? a.publishDate.slice(0, 10) : ''}" style="width:100%; padding:8px 12px; border:1px solid var(--research-border); border-radius:var(--radius-md); background:var(--research-surface); font-size:14px; color:var(--research-ink); font-family:var(--research-font-sans); outline:none; box-sizing:border-box;" />
            </div>
          </div>
          <div>
            <label style="display:block; font-size:13px; font-weight:500; color:var(--research-ink-2); margin-bottom:6px; font-family:var(--research-font-sans);">原文链接</label>
            <input id="rw-f-url" type="text" value="${DB.escape(a.url || '')}" placeholder="https://mp.weixin.qq.com/..." style="width:100%; padding:8px 12px; border:1px solid var(--research-border); border-radius:var(--radius-md); background:var(--research-surface); font-size:14px; color:var(--research-ink); font-family:var(--research-font-sans); outline:none; box-sizing:border-box;" />
          </div>
          <div style="display:flex; justify-content:flex-end; gap:12px; padding-top:8px;">
            <button id="rw-f-cancel" class="rw-btn" style="background:var(--research-surface); color:var(--research-ink-2); padding:10px 20px; border-radius:var(--radius-md); font-size:14px; font-weight:500; border:1px solid var(--research-border); cursor:pointer; font-family:var(--research-font-sans);">取消</button>
            <button id="rw-f-save" class="rw-btn" style="background:var(--research-primary); color:var(--research-primary-foreground); padding:10px 20px; border-radius:var(--radius-md); font-size:14px; font-weight:500; border:none; cursor:pointer; font-family:var(--research-font-sans);">${isEdit ? '保存修改' : '创建推文'}</button>
          </div>
        </div>
      `;

      const { modal, close } = UI.modal(isEdit ? '编辑推文' : '新建推文', bodyHTML);

      // 取消
      modal.querySelector('#rw-f-cancel').addEventListener('click', close);
      // 保存
      modal.querySelector('#rw-f-save').addEventListener('click', () => {
        const title = modal.querySelector('#rw-f-title').value.trim();
        if (!title) {
          UI.toast('请输入推文标题', 'error');
          return;
        }
        const data = {
          title: title,
          summary: modal.querySelector('#rw-f-summary').value.trim(),
          content: modal.querySelector('#rw-f-content').value.trim(),
          keywords: modal.querySelector('#rw-f-keywords').value
            .split(',').map(s => s.trim()).filter(Boolean),
          status: modal.querySelector('#rw-f-status').value,
          publishDate: modal.querySelector('#rw-f-date').value || null,
          url: modal.querySelector('#rw-f-url').value.trim(),
        };

        if (isEdit) {
          DB.update(DB.KEYS.ARTICLES, a.id, data);
          UI.toast('推文已更新', 'success');
        } else {
          DB.add(DB.KEYS.ARTICLES, data);
          UI.toast('推文已创建', 'success');
        }
        close();
        renderList();
      });
    }

    // 删除推文
    function deleteArticle(id) {
      const article = DB.get(DB.KEYS.ARTICLES, id);
      if (!article) return;
      if (UI.confirm(`确定要删除推文「${article.title || '无标题'}」吗？此操作不可撤销。`)) {
        DB.remove(DB.KEYS.ARTICLES, id);
        UI.toast('推文已删除', 'success');
        renderList();
      }
    }

    // 导出数据
    function exportData() {
      const exportObj = DB.exportAll();
      const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url;
      a.download = `research-workstation-export-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      UI.toast('数据已导出', 'success');
    }

    // 导入数据
    function importData(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const ok = DB.importAll(e.target.result);
        if (ok) {
          UI.toast('数据导入成功', 'success');
          renderList();
        } else {
          UI.toast('导入失败：文件格式不正确', 'error');
        }
      };
      reader.readAsText(file);
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      // 搜索
      const searchEl = document.getElementById('rw-search');
      searchEl.addEventListener('input', (e) => {
        currentSearch = e.target.value;
        renderList();
      });

      // 状态筛选
      const filterEl = document.getElementById('rw-status-filter');
      filterEl.addEventListener('change', (e) => {
        currentFilter = e.target.value;
        renderList();
      });

      // 新建按钮
      document.getElementById('rw-btn-create').addEventListener('click', openCreateModal);

      // 导出
      document.getElementById('rw-btn-export').addEventListener('click', exportData);

      // 导入
      const importBtn   = document.getElementById('rw-btn-import');
      const importInput = document.getElementById('rw-import-input');
      importBtn.addEventListener('click', () => importInput.click());
      importInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          importData(e.target.files[0]);
          e.target.value = ''; // 重置以便重复选择同一文件
        }
      });

      // 首次渲染
      lucide.createIcons();
      renderList();
    });
    </script>
</body>
</html>
