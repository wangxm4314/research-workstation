<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识网络</title>
    <style id="theme-vars">
/* ============================================================
   Research Workstation — Warm Editorial Theme
   科研暖色编辑风格 · 琥珀赭色系
   ============================================================ */

/* ---- Brand Prefix: research ---- */

:root {
  /* ---- Primary Brand Hue (Amber/Ochre) ---- */
  --color-brand-50: #FBF4E8;
  --color-brand-100: #F5E6CC;
  --color-brand-200: #EBCFA0;
  --color-brand-300: #DDB26E;
  --color-brand-400: #C99542;
  --color-brand-500: #B8770C;
  --color-brand-600: #A06608;
  --color-brand-700: #84540A;
  --color-brand-800: #6B450C;
  --color-brand-900: #543708;

  /* ---- Neutral Scale (Warm) ---- */
  --color-neutral-50: #FAF7F2;
  --color-neutral-100: #F5F1EB;
  --color-neutral-200: #E8E2D8;
  --color-neutral-300: #D4CCC0;
  --color-neutral-400: #B0A89C;
  --color-neutral-500: #8A8275;
  --color-neutral-600: #6B6357;
  --color-neutral-700: #4D463C;
  --color-neutral-800: #363028;
  --color-neutral-900: #241F1A;

  /* ---- Semantic Aliases (Light Mode) ---- */
  --research-background: #FAF7F2;
  --research-foreground: #241F1A;
  --research-card: #FFFFFF;
  --research-card-foreground: #241F1A;
  --research-popover: #FFFFFF;
  --research-popover-foreground: #241F1A;
  --research-primary: #B8770C;
  --research-primary-foreground: #FFFFFF;
  --research-muted: #F5F1EB;
  --research-muted-foreground: #6B6357;
  --research-border: #E8E2D8;
  --research-input: #E8E2D8;
  --research-ring: #B8770C;

  /* ---- Surface Tokens ---- */
  --research-surface: #FFFFFF;
  --research-surface-2: #F5F1EB;
  --research-surface-3: #EFE9DF;

  /* ---- Ink Tokens ---- */
  --research-ink: #241F1A;
  --research-ink-2: #4D463C;
  --research-ink-3: #8A8275;

  /* ---- Line Token ---- */
  --research-line: #E8E2D8;

  /* ---- Radius Scale ---- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  --research-radius-small: 4px;
  --research-radius-medium: 8px;
  --research-radius-large: 16px;

  /* ---- Shadow Scale ---- */
  --research-shadow-1: 0 1px 2px rgba(36, 31, 26, 0.04), 0 1px 1px rgba(36, 31, 26, 0.02);
  --research-shadow-floating: 0 8px 24px -8px rgba(36, 31, 26, 0.12);
  --research-shadow-modal: 0 24px 60px -20px rgba(36, 31, 26, 0.20);

  /* ---- Spacing Scale (8pt grid) ---- */
  --research-s-1: 4px;
  --research-s-2: 8px;
  --research-s-3: 12px;
  --research-s-4: 16px;
  --research-s-5: 24px;
  --research-s-6: 32px;
  --research-s-7: 48px;
  --research-s-8: 80px;

  /* ---- State Colors ---- */
  --state-success: #4A7C4A;
  --state-warning: #C99542;
  --state-error: #B0454B;
  --state-info: #4A6B8A;

  /* ---- Typography ---- */
  --research-font-serif: "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
  --research-font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --research-font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", monospace;

  /* ---- Color alias for general use ---- */
  --research-brand: #B8770C;
  --research-brand-ink: #FFFFFF;
}

/* ---- Dark Mode ---- */
.dark {
  --research-background: #1A1612;
  --research-foreground: #E8E2D8;
  --research-card: #241F1A;
  --research-card-foreground: #E8E2D8;
  --research-popover: #2A241E;
  --research-popover-foreground: #E8E2D8;
  --research-primary: #C99542;
  --research-primary-foreground: #1A1612;
  --research-muted: #2A241E;
  --research-muted-foreground: #B0A89C;
  --research-border: #363028;
  --research-input: #363028;
  --research-ring: #C99542;

  --research-surface: #241F1A;
  --research-surface-2: #2A241E;
  --research-surface-3: #363028;

  --research-ink: #E8E2D8;
  --research-ink-2: #B0A89C;
  --research-ink-3: #8A8275;

  --research-line: #363028;

  --state-success: #6B9C6B;
  --state-warning: #DDB26E;
  --state-error: #D06870;
  --state-info: #7A9CBA;

  --research-brand: #C99542;
  --research-brand-ink: #1A1612;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--research-background);
    --color-foreground: var(--research-foreground);
    --color-card: var(--research-card);
    --color-card-foreground: var(--research-card-foreground);
    --color-popover: var(--research-popover);
    --color-popover-foreground: var(--research-popover-foreground);
    --color-primary: var(--research-primary);
    --color-primary-foreground: var(--research-primary-foreground);
    --color-muted: var(--research-muted);
    --color-muted-foreground: var(--research-muted-foreground);
    --color-border: var(--research-border);
    --color-input: var(--research-input);
    --color-ring: var(--research-ring);
    --radius-sm: var(--research-radius-small);
    --radius-md: var(--research-radius-medium);
    --radius-lg: var(--research-radius-large);
  }
  @layer base {
    body { background: var(--research-background); color: var(--research-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--research-background); }
      .text-background { color: var(--research-background); }
      .border-background { border-color: var(--research-background); }
      .ring-background { --tw-ring-color: var(--research-background); }
      .bg-foreground { background-color: var(--research-foreground); }
      .text-foreground { color: var(--research-foreground); }
      .border-foreground { border-color: var(--research-foreground); }
      .ring-foreground { --tw-ring-color: var(--research-foreground); }
      .bg-card { background-color: var(--research-card); }
      .text-card { color: var(--research-card); }
      .border-card { border-color: var(--research-card); }
      .ring-card { --tw-ring-color: var(--research-card); }
      .bg-card-foreground { background-color: var(--research-card-foreground); }
      .text-card-foreground { color: var(--research-card-foreground); }
      .border-card-foreground { border-color: var(--research-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--research-card-foreground); }
      .bg-popover { background-color: var(--research-popover); }
      .text-popover { color: var(--research-popover); }
      .border-popover { border-color: var(--research-popover); }
      .ring-popover { --tw-ring-color: var(--research-popover); }
      .bg-popover-foreground { background-color: var(--research-popover-foreground); }
      .text-popover-foreground { color: var(--research-popover-foreground); }
      .border-popover-foreground { border-color: var(--research-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--research-popover-foreground); }
      .bg-primary { background-color: var(--research-primary); }
      .text-primary { color: var(--research-primary); }
      .border-primary { border-color: var(--research-primary); }
      .ring-primary { --tw-ring-color: var(--research-primary); }
      .bg-primary-foreground { background-color: var(--research-primary-foreground); }
      .text-primary-foreground { color: var(--research-primary-foreground); }
      .border-primary-foreground { border-color: var(--research-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--research-primary-foreground); }
      .bg-muted { background-color: var(--research-muted); }
      .text-muted { color: var(--research-muted); }
      .border-muted { border-color: var(--research-muted); }
      .ring-muted { --tw-ring-color: var(--research-muted); }
      .bg-muted-foreground { background-color: var(--research-muted-foreground); }
      .text-muted-foreground { color: var(--research-muted-foreground); }
      .border-muted-foreground { border-color: var(--research-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--research-muted-foreground); }
      .bg-border { background-color: var(--research-border); }
      .text-border { color: var(--research-border); }
      .border-border { border-color: var(--research-border); }
      .ring-border { --tw-ring-color: var(--research-border); }
      .bg-input { background-color: var(--research-input); }
      .text-input { color: var(--research-input); }
      .border-input { border-color: var(--research-input); }
      .ring-input { --tw-ring-color: var(--research-input); }
      .bg-ring { background-color: var(--research-ring); }
      .text-ring { color: var(--research-ring); }
      .border-ring { border-color: var(--research-ring); }
      .ring-ring { --tw-ring-color: var(--research-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <!-- ============ Shared Sidebar ============ -->
      <aside class="fixed top-0 left-0 h-screen w-[240px] z-50 flex flex-col" style="background: var(--research-surface); border-right: 1px solid var(--research-border);">
        <!-- Logo -->
        <div style="font-family: var(--research-font-serif); font-size: 18px; font-weight: 600; padding: 20px 24px; border-bottom: 1px solid var(--research-border); color: var(--research-ink);">
          科研工作站
        </div>
        <!-- Nav -->
        <nav class="flex-1 overflow-y-auto no-scrollbar" style="padding-top: 8px;">
          <a data-dom-id="nav-dashboard" data-nav-key="dashboard" href="#" class="flex items-center gap-3" style="padding: 12px 24px; font-size: 14px; color: var(--research-ink-2); border-left: 3px solid transparent;">
            <i data-lucide="layout-dashboard" style="width:20px;height:20px;"></i>
            <span>概览</span>
          </a>
          <a data-dom-id="nav-mp-articles" data-nav-key="mp-articles" href="#" class="flex items-center gap-3" style="padding: 12px 24px; font-size: 14px; color: var(--research-ink-2); border-left: 3px solid transparent;">
            <i data-lucide="newspaper" style="width:20px;height:20px;"></i>
            <span>公众号推文</span>
          </a>
          <a data-dom-id="nav-scripts" data-nav-key="scripts" href="#" class="flex items-center gap-3" style="padding: 12px 24px; font-size: 14px; color: var(--research-ink-2); border-left: 3px solid transparent;">
            <i data-lucide="code-2" style="width:20px;height:20px;"></i>
            <span>脚本仓库</span>
          </a>
          <a data-dom-id="nav-literature" data-nav-key="literature" href="#" class="flex items-center gap-3" style="padding: 12px 24px; font-size: 14px; color: var(--research-ink-2); border-left: 3px solid transparent;">
            <i data-lucide="book-open" style="width:20px;height:20px;"></i>
            <span>文献阅读</span>
          </a>
          <a data-dom-id="nav-gallery" data-nav-key="gallery" href="#" class="flex items-center gap-3" style="padding: 12px 24px; font-size: 14px; color: var(--research-ink-2); border-left: 3px solid transparent;">
            <i data-lucide="image" style="width:20px;height:20px;"></i>
            <span>图片存储</span>
          </a>
          <a data-dom-id="nav-writing" data-nav-key="writing" href="#" class="flex items-center gap-3" style="padding: 12px 24px; font-size: 14px; color: var(--research-ink-2); border-left: 3px solid transparent;">
            <i data-lucide="pen-line" style="width:20px;height:20px;"></i>
            <span>文章撰写</span>
          </a>
          <a data-dom-id="nav-knowledge-network" data-nav-key="knowledge-network" href="#" class="flex items-center gap-3" style="padding: 12px 24px; font-size: 14px; background: var(--research-surface-2); color: var(--research-primary); border-left: 3px solid var(--research-primary);">
            <i data-lucide="share-2" style="width:20px;height:20px;"></i>
            <span>知识网络</span>
          </a>
        </nav>
        <!-- Avatar -->
        <div class="flex items-center gap-3" style="padding: 20px 24px; border-top: 1px solid var(--research-border);">
          <div style="width:32px;height:32px;border-radius:var(--radius-full);background:var(--research-surface-3);display:flex;align-items:center;justify-content:center;color:var(--research-ink-2);font-size:13px;font-weight:600;">研</div>
          <span style="font-size:14px;color:var(--research-ink-2);">研究员</span>
        </div>
      </aside>

      <!-- ============ Main Content ============ -->
      <div style="margin-left: 240px; padding: 32px; background: var(--research-background); min-height: 100vh;">
        <!-- Header Bar -->
        <header class="flex items-center justify-between" style="height: 60px; border-bottom: 1px solid var(--research-border); margin-bottom: 24px; padding-bottom: 16px;">
          <h1 style="font-family: var(--research-font-serif); font-size: 24px; font-weight: 600; color: var(--research-ink);">知识网络</h1>
          <div class="flex items-center gap-3">
            <input type="text" placeholder="搜索关键词..." style="width: 280px; padding: 8px 12px; border: 1px solid var(--research-border); border-radius: var(--radius-md); font-size: 14px; color: var(--research-ink); background: var(--research-card); outline: none;"/>
            <button style="background: var(--research-surface); border: 1px solid var(--research-border); color: var(--research-ink); padding: 8px 16px; border-radius: var(--radius-md); font-size: 14px; cursor: pointer;">重新布局</button>
          </div>
        </header>

        <!-- Info Bar -->
        <div class="flex items-center gap-3" style="margin-bottom: 24px; padding: 12px 16px; background: var(--research-surface-2); border-radius: var(--radius-md);">
          <i data-lucide="info" style="width:16px;height:16px;color:var(--research-ink-3);"></i>
          <span style="font-size: 13px; color: var(--research-ink-2);">跨模块关键词索引网络 — 展示公众号推文、文献、脚本、图片之间的关键词关联关系</span>
        </div>

        <!-- Main Layout: Two columns -->
        <div style="display: grid; grid-template-columns: 1fr 300px; gap: 24px;">
          <!-- Left Column: Network Visualization -->
          <div style="background: var(--research-card); border: 1px solid var(--research-border); border-radius: var(--radius-lg); padding: 24px; min-height: 600px; position: relative;">
            <div style="position: absolute; top: 16px; left: 24px; font-family: var(--research-font-serif); font-size: 16px; font-weight: 600; color: var(--research-ink); z-index: 2;">关键词关联网络</div>
            <svg width="100%" height="560px" viewBox="0 0 800 560" style="display: block; margin-top: 8px;">
              <!-- Edges -->
              <line x1="200" y1="100" x2="400" y2="80" stroke="var(--research-border)" stroke-width="1.5" opacity="0.6"/>
              <line x1="200" y1="100" x2="350" y2="350" stroke="var(--research-border)" stroke-width="1.5" opacity="0.6"/>
              <line x1="200" y1="100" x2="650" y2="150" stroke="var(--research-border)" stroke-width="1.5" opacity="0.6"/>
              <line x1="150" y1="250" x2="500" y2="200" stroke="var(--research-border)" stroke-width="1.5" opacity="0.6"/>
              <line x1="150" y1="250" x2="550" y2="400" stroke="var(--research-border)" stroke-width="1.5" opacity="0.6"/>
              <line x1="500" y1="200" x2="450" y2="280" stroke="var(--research-border)" stroke-width="1.5" opacity="0.6"/>
              <line x1="300" y1="400" x2="700" y2="350" stroke="var(--research-border)" stroke-width="1.5" opacity="0.6"/>
              <line x1="350" y1="350" x2="250" y2="500" stroke="var(--research-border)" stroke-width="1.5" opacity="0.6"/>
              <line x1="450" y1="280" x2="550" y2="400" stroke="var(--research-border)" stroke-width="1.5" opacity="0.6"/>
              <line x1="650" y1="150" x2="400" y2="80" stroke="var(--research-border)" stroke-width="1.5" opacity="0.6"/>
              <line x1="150" y1="250" x2="600" y2="500" stroke="var(--research-border)" stroke-width="1.5" opacity="0.6"/>
              <line x1="650" y1="280" x2="350" y2="350" stroke="var(--research-border)" stroke-width="1.5" opacity="0.6"/>
              <line x1="300" y1="400" x2="350" y2="350" stroke="var(--research-border)" stroke-width="1.5" opacity="0.6"/>

              <!-- Nodes: Articles (amber) -->
              <circle cx="200" cy="100" r="20" fill="var(--research-primary)" opacity="0.8"/>
              <text x="200" y="134" font-size="10" fill="var(--research-ink-2)" text-anchor="middle">CRISPR推文</text>
              <circle cx="150" cy="250" r="20" fill="var(--research-primary)" opacity="0.8"/>
              <text x="150" y="284" font-size="10" fill="var(--research-ink-2)" text-anchor="middle">单细胞推文</text>
              <circle cx="300" cy="400" r="20" fill="var(--research-primary)" opacity="0.8"/>
              <text x="300" y="434" font-size="10" fill="var(--research-ink-2)" text-anchor="middle">WB推文</text>

              <!-- Nodes: Literature (blue) -->
              <circle cx="400" cy="80" r="18" fill="var(--state-info)" opacity="0.8"/>
              <text x="400" y="112" font-size="10" fill="var(--research-ink-2)" text-anchor="middle">Nature-CRISPR</text>
              <circle cx="500" cy="200" r="18" fill="var(--state-info)" opacity="0.8"/>
              <text x="500" y="232" font-size="10" fill="var(--research-ink-2)" text-anchor="middle">Cell-单细胞</text>
              <circle cx="350" cy="350" r="18" fill="var(--state-info)" opacity="0.8"/>
              <text x="350" y="382" font-size="10" fill="var(--research-ink-2)" text-anchor="middle">NatGen-CRISPR</text>
              <circle cx="550" cy="400" r="18" fill="var(--state-info)" opacity="0.8"/>
              <text x="550" y="432" font-size="10" fill="var(--research-ink-2)" text-anchor="middle">Cell-TME</text>

              <!-- Nodes: Scripts (green) -->
              <circle cx="650" cy="150" r="16" fill="var(--state-success)" opacity="0.8"/>
              <text x="650" y="180" font-size="10" fill="var(--research-ink-2)" text-anchor="middle">RNA-seq脚本</text>
              <circle cx="700" cy="350" r="16" fill="var(--state-success)" opacity="0.8"/>
              <text x="700" y="380" font-size="10" fill="var(--research-ink-2)" text-anchor="middle">可视化脚本</text>

              <!-- Nodes: Gallery (amber-light) -->
              <circle cx="250" cy="500" r="16" fill="var(--state-warning)" opacity="0.8"/>
              <text x="250" y="528" font-size="10" fill="var(--research-ink-2)" text-anchor="middle">信号通路图</text>
              <circle cx="600" cy="500" r="16" fill="var(--state-warning)" opacity="0.8"/>
              <text x="600" y="528" font-size="10" fill="var(--research-ink-2)" text-anchor="middle">单细胞图</text>

              <!-- Nodes: Writing (dark) -->
              <circle cx="450" cy="280" r="18" fill="var(--research-ink-2)" opacity="0.8"/>
              <text x="450" y="312" font-size="10" fill="var(--research-ink-2)" text-anchor="middle">TME综述</text>
              <circle cx="650" cy="280" r="18" fill="var(--research-ink-2)" opacity="0.8"/>
              <text x="650" y="312" font-size="10" fill="var(--research-ink-2)" text-anchor="middle">CRISPR综述</text>
            </svg>
          </div>

          <!-- Right Column: Legend & Stats -->
          <div class="flex flex-col" style="gap: 20px;">
            <!-- Legend Card -->
            <div style="background: var(--research-card); border: 1px solid var(--research-border); border-radius: var(--radius-lg); padding: 20px;">
              <div style="font-family: var(--research-font-serif); font-size: 14px; font-weight: 600; color: var(--research-ink); margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--research-border);">图例</div>
              <div class="flex items-center" style="gap: 12px; padding: 6px 0;">
                <span style="width:12px;height:12px;border-radius:var(--radius-full);background:var(--research-primary);display:inline-block;"></span>
                <span style="font-size:13px;color:var(--research-ink-2);">公众号推文</span>
              </div>
              <div class="flex items-center" style="gap: 12px; padding: 6px 0;">
                <span style="width:12px;height:12px;border-radius:var(--radius-full);background:var(--state-info);display:inline-block;"></span>
                <span style="font-size:13px;color:var(--research-ink-2);">文献阅读</span>
              </div>
              <div class="flex items-center" style="gap: 12px; padding: 6px 0;">
                <span style="width:12px;height:12px;border-radius:var(--radius-full);background:var(--state-success);display:inline-block;"></span>
                <span style="font-size:13px;color:var(--research-ink-2);">脚本仓库</span>
              </div>
              <div class="flex items-center" style="gap: 12px; padding: 6px 0;">
                <span style="width:12px;height:12px;border-radius:var(--radius-full);background:var(--state-warning);display:inline-block;"></span>
                <span style="font-size:13px;color:var(--research-ink-2);">图片存储</span>
              </div>
              <div class="flex items-center" style="gap: 12px; padding: 6px 0;">
                <span style="width:12px;height:12px;border-radius:var(--radius-full);background:var(--research-ink-2);display:inline-block;"></span>
                <span style="font-size:13px;color:var(--research-ink-2);">文章撰写</span>
              </div>
